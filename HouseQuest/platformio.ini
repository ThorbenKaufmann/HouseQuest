; PlatformIO Project Configuration File
;
; One env per display kit:
;   pio run -e aztouch-24 -t upload     AZ-Touch, 2.4" ILI9341 (default)
;   pio run -e aztouch-28 -t upload     AZ-Touch MOD, 2.8" ILI9341
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = aztouch-24

; ── Shared by all variants ───────────────────────────────────────────────────
[env]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

board_build.filesystem = littlefs

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17

; TFT_eSPI is configured here instead of editing its User_Setup.h
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=22
    -D TOUCH_CS=14
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D HQ_TFT_LED=15          ; backlight, active low

; ── Variants ─────────────────────────────────────────────────────────────────
; HQ_TFT_ROTATION  display rotation (1 or 3 for landscape)
; HQ_TOUCH_CAL     optional factory touch calibration; without it the panel
;                  calibrates itself on first boot. Stored in NVS either way.

[env:aztouch-24]
build_flags =
    ${env.build_flags}
    -D HQ_TFT_ROTATION=1
    '-D HQ_TOUCH_CAL={235,3347,377,3385,1}'

[env:aztouch-28]
build_flags =
    ${env.build_flags}
    -D HQ_TFT_ROTATION=1
