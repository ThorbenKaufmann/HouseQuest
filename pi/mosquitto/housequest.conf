# HouseQuest broker (LAN/VPN only) → /etc/mosquitto/conf.d/housequest.conf
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Write retained state to SD at most every 5 min (less card wear)
autosave_interval 300

listener 1883
protocol mqtt

listener 9001
protocol websockets
