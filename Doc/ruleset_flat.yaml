    erlaubt – Reparatur gehört dazu
  text: Wir dürfen Fehler machen. Wichtig ist, Verantwortung zu übernehmen und wieder
    aufeinander zuzugehen.
  xp: 0
  hp: 0
  level: 0
- id: 2.1.1
