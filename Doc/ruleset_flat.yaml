rules:
- id: 0.1.1
  path: 0. Unser Fundament (Erwachsenen-/Wir-Ebene) > 0.1 Unser _Wir_ ist ein sicherer
    Ort
  text: Wir gehören zusammen und verlieren uns auch in schwierigen Zeiten nicht aus
    dem Blick. Probleme lösen wir miteinander und nicht gegeneinander.
  xp: 0
  hp: 0
  level: 0
- id: 0.2.1
  path: 0. Unser Fundament (Erwachsenen-/Wir-Ebene) > 0.2 Liebe und Zugehörigkeit
    sind kein Druckmittel
  text: Nähe, Liebe und Zugehörigkeit werden nicht als Belohnung oder Strafe eingesetzt.
    Wir sprechen ehrlich über Gefühle, Zweifel und Bedürfnisse.
  xp: 0
  hp: 0
  level: 0
- id: 0.3.1
  path: 0. Unser Fundament (Erwachsenen-/Wir-Ebene) > 0.3 Wir, die Erwachsenen, tragen
    gemeinsam Verantwortung
  text: Die Erwachsenen geben Orientierung, treffen Absprachen miteinander und schützen
    das gute Zusammenleben.
  xp: 0
  hp: 0
  level: 0
- id: 1.1.1
  path: 1. Grundrechte und Gemeinschaft (Haus- und Familienebene) > 1.1 Wir sind freundlich
    zueinander und achten uns
  text: Wir behandeln einander mit Respekt, auch wenn wir unterschiedlicher Meinung
    sind.
  xp: 0
  hp: 0
  level: 0
- id: 1.2.1
  path: 1. Grundrechte und Gemeinschaft (Haus- und Familienebene) > 1.2 Jeder darf
    sich sicher und willkommen fühlen
  text: Dieses Haus soll ein Ort sein, an dem sich niemand ausgegrenzt, bedroht oder
    dauerhaft unerwünscht fühlen muss.
  xp: 0
  hp: 0
  level: 0
- id: 1.3.1
  path: 1. Grundrechte und Gemeinschaft (Haus- und Familienebene) > 1.3 Wir achten
    Ruhe und Rückzug
  text: Schlaf, Ruhe und persönliche Rückzugszeiten verdienen Respekt.
  xp: 0
  hp: 0
  level: 0
- id: 1.4.1
  path: 1. Grundrechte und Gemeinschaft (Haus- und Familienebene) > 1.4 Probleme dürfen
    angesprochen werden
  text: Schwierigkeiten, Wünsche und Belastungen dürfen offen und respektvoll angesprochen
    werden. Wir sammeln Konflikte nicht heimlich an.
  xp: 0
  hp: 0
  level: 0
- id: 1.5.1
  path: 1. Grundrechte und Gemeinschaft (Haus- und Familienebene) > 1.5 Jeder trägt
