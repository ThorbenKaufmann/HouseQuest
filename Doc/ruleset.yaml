      xp: 0
      hp: 10
      level: 2
  - title: 8.2 Ofen und Herd
    rules:
    - text: Herd und Ofen sind nach jeder Nutzung sauber zu hinterlassen.
      xp: 0
      hp: 10
      level: 1
    - text: Übergelaufene Flüssigkeiten oder Speisereste sind unmittelbar zu entfernen.
      xp: 0
      hp: 10
      level: 2
    - text: Kochfelder sind nach dem Abkühlen zu reinigen.
      xp: 0
      hp: 10
      level: 2
    - text: Ofen und Backbleche sind nach Nutzung von Verschmutzungen zu befreien.
      xp: 0
      hp: 10
      level: 2
    - text: Kochgeräte sind nach der Nutzung vollständig auszuschalten.
      xp: 0
      hp: 10
      level: 2
    - text: Kochutensilien und verwendetes Zubehör sind nach Gebrauch zu reinigen
        und zurückzustellen.
      xp: 0
      hp: 10
      level: 2
  - title: 8.3 Mikrowelle
    rules:
    - text: Lebensmittel sind in der Mikrowelle nur mit geeigneter Abdeckung zu erwärmen.
      xp: 0
      hp: 10
      level: 2
    - text: Verschmutzungen im Innenraum sind unmittelbar nach der Nutzung zu entfernen.
      xp: 0
      hp: 10
      level: 2
    - text: Übergelaufene oder verspritzte Lebensmittel sind vollständig zu reinigen.
      xp: 0
      hp: 10
      level: 2
    - text: Die Mikrowelle ist nach der Nutzung auszuschalten.
      xp: 0
      hp: 10
      level: 2
    - text: Drehteller und Innenflächen sind sauber zu halten.
      xp: 0
      hp: 10
      level: 2
    - text: Die Mikrowelle ist frei von Lebensmittelresten zu hinterlassen.
      xp: 0
      hp: 10
      level: 2
  - title: 8.4 Kühlschrank
    rules:
    - text: Lebensmittel sind im Kühlschrank geordnet und hygienisch zu lagern.
      xp: 0
      hp: 10
      level: 2
    - text: Angebrochene Lebensmittel sind zu verschließen oder abzudecken.
      xp: 0
      hp: 10
      level: 2
    - text: Lebensmittel sind so zu lagern, dass Verderb und Geruchsbildung vermieden
        werden.
      xp: 0
      hp: 10
      level: 2
    - text: Verdorbene oder überlagerte Lebensmittel sind unverzüglich zu entsorgen.
      xp: 0
      hp: 10
      level: 2
    - text: Verschüttete Flüssigkeiten oder Verschmutzungen im Kühlschrank sind sofort
        zu reinigen.
      xp: 0
      hp: 10
      level: 2
    - text: Lebensmittel sind so zu platzieren, dass der Kühlschrank effizient geschlossen
        werden kann.
      xp: 0
      hp: 10
      level: 2
    - text: Die Kühlschranktür ist nach jeder Nutzung vollständig zu schließen.
      xp: 0
      hp: 10
      level: 2
  - title: 8.5 Elektrische Kleingeräte und Werkzeuge
    rules:
    - text: Elektrische Küchengeräte sind sachgerecht und nur für ihren vorgesehenen
        Zweck zu verwenden.
      xp: 0
      hp: 10
      level: 2
    - text: Geräte sind nach der Nutzung auszuschalten und vom Stromnetz zu trennen,
        sofern sie nicht dauerhaft betrieben werden müssen.
      xp: 0
      hp: 10
      level: 2
    - text: Geräte und Zubehör sind nach der Nutzung zu reinigen.
      xp: 0
      hp: 10
      level: 2
    - text: Elektrische Kleingeräte sind nach der Nutzung an ihren vorgesehenen Platz
        zurückzustellen.
      xp: 0
      hp: 10
      level: 2
    - text: Beschädigte oder fehlerhafte Geräte sind nicht weiter zu benutzen und
        zu melden.
      xp: 0
      hp: 10
      level: 2
    - text: Kabel, Aufsätze und Zubehör sind vollständig und geordnet aufzubewahren.
      xp: 0
      hp: 10
      level: 2
  - title: 8.6 Reinigung
    rules:
    - text: Die Küche ist nach jeder Nutzung sauber und hygienisch zu hinterlassen.
      xp: 0
      hp: 10
      level: 2
    - text: Lebensmittelreste, Krümel und Verschmutzungen sind unmittelbar zu entfernen.
      xp: 0
      hp: 10
      level: 2
    - text: Arbeitsflächen sind nach der Nutzung mit sauberen Tüchern zu reinigen.
      xp: 0
      hp: 10
      level: 2
    - text: Fett und Speisereste sind nicht mit verschmutzten Lappen zu verteilen,
        sondern hygienisch zu entfernen.
      xp: 0
      hp: 10
      level: 2
    - text: Spül- und Reinigungstücher sind regelmäßig zu wechseln und sauber zu halten.
      xp: 0
      hp: 10
      level: 2
    - text: Schneideflächen und Arbeitsbereiche sind lebensmittelhygienisch zu reinigen.
      xp: 0
      hp: 10
      level: 2
    - text: Ein verbindlicher Reinigungsplan regelt die regelmäßige Grundreinigung
        der Küche.
      xp: 0
      hp: 10
      level: 2
- title: 9 Zimmer
  children:
  - title: 9.1 Private Zimmer
    rules:
    - text: Die privaten Zimmer sind sauber und ordentlich zu halten. Der Boden ist
        begehbar und frei von herumliegender Wäsche, Unrat, Geschirr und Lebensmitteln
        zu halten.
      xp: 0
      hp: 10
      level: 1
    - text: Gebrauchtes Geschirr ist spätestens am selben Tag in Küche oder Spülmaschine
        zurückzubringen.
      xp: 0
      hp: 10
      level: 1
    - text: Müll und verderbliche Lebensmittel dürfen nicht im Zimmer lagern.
      xp: 0
      hp: 10
      level: 1
    - text: Gegenstände benötigen einen festen Platz. Fehlt dieser, ist gemeinsam
        eine Lösung zu schaffen.
      xp: 0
      hp: 10
      level: 1
