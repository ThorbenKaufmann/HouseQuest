# Task templates for "Aufgaben" on the Pi board (pi/game.py).
#   xp: reward when an admin approves the task
#   hp: cost when the task was taken but not done (cancelled / plan ended)
#   active: false → kept for history, no longer offered for new plans
# Import (updates templates with the same title, adds new ones):
#   python python/catalog_import.py [--dry-run]     # broker from HOUSEQUEST_MQTT_*
# Titles: max. 30 characters.

